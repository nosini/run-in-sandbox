# A second, playback-only PulseAudio server for run-in-sandbox games.
# Installed to ~/.config/pipewire/ by `install.sh --restrict-audio` and run by
# sandbox-pulse.service; sandbox-game hands its socket to every game in place
# of the desktop's own Pulse server and PipeWire socket.
#
# Why a server of its own rather than a second socket on the desktop's: a
# Pulse client may load modules, and pipewire-pulse loads them with its own
# rights, outside the sandbox. module-rtp-send, module-tunnel-sink and
# module-roc-sink would carry audio -- or anything encoded as audio -- to any
# address on the network, from a game that has none; module-pipe-sink writes
# into a named pipe anywhere on the host; module-native-protocol-tcp would open
# the sound server to the LAN. Module loading can only be switched off for a
# whole server, and the desktop's may well want it.
#
# Everything connecting here is given an access class of its own,
# "sandbox-game". WirePlumber, configured by 60-sandbox-audio.conf, then hides
# microphones and monitors from it and refuses to connect any recording stream
# it opens. Its own class rather than the stock "restricted", so that what
# WirePlumber allows restricted clients elsewhere is left exactly as it was.

context.properties = {
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { nice.level = -11 rtportal.enabled = false }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-protocol-pulse }
]

# WirePlumber remembers the device a stream was last moved to, under the first
# of application.id, application.name, media.name and node.name the stream's
# node carries -- and the nodes pipewire-pulse makes carry no application.name
# by the time WirePlumber looks (PipeWire 1.6.9). So it goes by media.name,
# which Chromium sets to "Playback" in NW.js and every Chromium browser alike:
# moving the game moved Brave, and the other way round. Without a media.name
# the key falls through to node.name, which pw_stream takes from the client's
# application.name -- for NW.js the game's folder name (PULSE_PROP_OVERRIDE,
# set by the launcher) -- so each game keeps a device of its own. null
# removes a property; this applies after the stream's own properties and
# before its node exists.
stream.properties = {
    media.name = null
}

pulse.properties = {
    # Relative to $PULSE_RUNTIME_PATH, which the service points at
    # $XDG_RUNTIME_DIR/sandbox-pulse -- away from the desktop server's pulse/.
    server.address = [
        { address = "unix:native" client.access = "sandbox-game" }
    ]
    pulse.allow-module-loading = false
}
