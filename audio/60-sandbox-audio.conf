# Playback only, for clients of access class "sandbox-game" -- which is what
# run-in-sandbox's own Pulse server (sandbox-pulse.conf) marks every game as,
# and nothing else does. Installed to ~/.config/wireplumber/wireplumber.conf.d/
# by `install.sh --restrict-audio`.
#
# A class of its own, not the stock "restricted", so nothing here changes what
# WirePlumber allows any other client. One consequence: WirePlumber gives a
# class it has no rule for full access, so the rule below must never be
# without the rest -- which is why all of it lives in this one file, and the
# scripts are required.
#
# Two layers. A permission manager decides what a game can see, and it is
# set up by a script of ours (sandbox-access.lua): nothing by default, then
# only the sinks, the default-device metadata, the factories a stream is made
# with, and the game's own objects. That last needs a callback, which a rule
# here cannot express. So other applications' streams and clients -- their
# titles, binaries and PIDs -- are hidden, and so are every source and
# microphone, the monitor ports of every sink (a "Monitor of ..." source is
# really those), and the link factory, so a game cannot wire another app's
# stream to itself. But hiding is not enough on its own: WirePlumber links a
# recording stream to the default source on the client's behalf, with its own
# rights, whatever the client can see. So a hook of ours
# (deny-restricted-capture.lua) refuses to link any recording stream from a
# sandbox-game client at all.
#
# The permission manager below is a backstop: sandbox-access.lua claims
# sandbox-game clients first, and this one applies only if it ever does not.
# It hides what can be recorded, if not what is playing.

access.permission-managers = [
  {
    name = "sandbox-playback-only"
    default_permissions = "rx"
    core_permissions = "rx"
    rules = [
      {
        matches = [
          { media.class = "Audio/Source" }
          { media.class = "Audio/Source/Virtual" }
          { media.class = "Audio/Duplex" }
          { media.class = "Video/Source" }
          { port.monitor = "true" }
          { factory.name = "link-factory" }
        ]
        actions = { set-permissions = "-" }
      }
    ]
  }
]

# No default_permissions here: set alongside permission_manager_name, it
# would win and the permission manager would be ignored.
access.rules = [
  {
    matches = [ { access = "sandbox-game" } ]
    actions = { update-props = { permission_manager_name = "sandbox-playback-only" } }
  }
]

# Required, not optional: if a script ever fails to load, WirePlumber refuses
# to start and the silence says so, rather than games quietly regaining the
# microphone or the view of other applications.
wireplumber.components = [
  {
    name = sandbox-game/deny-restricted-capture.lua, type = script/lua
    provides = custom.sandbox-game.deny-restricted-capture
  }
  {
    name = sandbox-game/sandbox-access.lua, type = script/lua
    provides = custom.sandbox-game.sandbox-access
  }
]

wireplumber.profiles = {
  main = {
    custom.sandbox-game.deny-restricted-capture = required
    custom.sandbox-game.sandbox-access = required
  }
}
