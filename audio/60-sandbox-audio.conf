# Playback only, for clients WirePlumber sees as "restricted" -- which is what
# run-in-sandbox's own Pulse server (sandbox-pulse.conf) marks every game as.
# Installed to ~/.config/wireplumber/wireplumber.conf.d/ by
# `install.sh --restrict-audio`.
#
# Two layers. The permission manager hides what a game could name: every
# source and microphone, the monitor ports of every sink (a "Monitor of ..."
# source is really those), and the link factory, so a game cannot wire another
# app's stream to itself. But hiding is not enough on its own: WirePlumber
# links a recording stream to the default source on the client's behalf, with
# its own rights, whatever the client can see. So a hook of ours
# (deny-restricted-capture.lua) refuses to link any recording stream from a
# restricted client at all.
#
# This applies to every restricted client, not only games: PulseAudio clients
# coming in over TCP are restricted by default too.

access.permission-managers = [
  {
    name = "sandbox-playback-only"
    default_permissions = "rx"
    core_permissions = "rx"
    rules = [
      {
        matches = [
          { media.class = "Audio/Source" }
          { media.class = "Audio/Source/Virtual" }
          { media.class = "Audio/Duplex" }
          { media.class = "Video/Source" }
          { port.monitor = "true" }
          { factory.name = "link-factory" }
        ]
        actions = { set-permissions = "-" }
      }
    ]
  }
]

# No default_permissions here: set alongside permission_manager_name, it
# would win and the permission manager would be ignored.
access.rules = [
  {
    matches = [ { access = "restricted" } ]
    actions = { update-props = { permission_manager_name = "sandbox-playback-only" } }
  }
]

# Required, not optional: if the hook ever fails to load, WirePlumber refuses
# to start and the silence says so, rather than games quietly regaining the
# microphone.
wireplumber.components = [
  {
    name = sandbox-game/deny-restricted-capture.lua, type = script/lua
    provides = custom.sandbox-game.deny-restricted-capture
  }
]

wireplumber.profiles = {
  main = {
    custom.sandbox-game.deny-restricted-capture = required
  }
}
